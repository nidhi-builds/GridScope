services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: gridscope
      POSTGRES_USER: gridscope
      POSTGRES_PASSWORD: gridscope
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridscope -d gridscope"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql

  web:
    build: .
    command: sh -c "python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://gridscope:gridscope@db:5432/gridscope
      APP_ENV: development
      LOG_LEVEL: INFO
      SEED: "true"
      # Open on a live network rather than a grey one.
      SEED_BASELINE_LIVE: "true"
      # Routine heartbeats, OFF here on purpose. The sweep writes pole evidence
      # continuously, and `pytest` runs against this same database — leaving it
      # on corrupts test fixtures mid-run. Set it on the deployed service, or
      # locally only when you are not running the suites.
      HEARTBEAT_SWEEP_SECONDS: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend-test:
    image: node:22.14.0-alpine
    profiles: ["tools"]
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
    command: sh -c "npm ci && npm test -- --run"

  # Opt-in runners. A plain `docker compose up` still starts only db and web.
  # Browsers install at run time from a pinned @playwright/test version, so the
  # runner cannot drift from the browser build the way a stale image tag can.
  browser-test:
    image: node:22.14.0-bookworm
    profiles: ["tools"]
    working_dir: /workspace
    environment:
      GRIDSCOPE_BASE_URL: http://web:8000
      CI: "true"
    volumes:
      - ./e2e:/workspace/e2e
      - ./playwright.config.ts:/workspace/playwright.config.ts:ro
      - ./performance/results:/workspace/performance/results
      - playwright-browsers:/root/.cache/ms-playwright
    depends_on:
      web:
        condition: service_healthy
    command: >
      sh -c "npm init -y >/dev/null 2>&1
      && npm install --no-save --no-audit --no-fund @playwright/test@1.54.1
      && npx playwright install --with-deps chromium
      && npx playwright test"

  k6:
    image: grafana/k6:0.54.0
    profiles: ["tools"]
    environment:
      GRIDSCOPE_BASE_URL: http://web:8000
    volumes:
      - ./performance:/tests:ro
      - ./performance/results:/results
    depends_on:
      web:
        condition: service_healthy
    entrypoint: ["k6"]

  measure:
    build: .
    profiles: ["tools"]
    working_dir: /app
    environment:
      GRIDSCOPE_BASE_URL: http://web:8000
    volumes:
      - ./scripts:/app/scripts:ro
      - ./performance/results:/app/performance/results
    depends_on:
      web:
        condition: service_healthy
    entrypoint: ["python"]

volumes:
  postgres-data:
  playwright-browsers:
